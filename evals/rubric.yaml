version: "1.0"
name: "NimbusFlow Autopay Voice Recovery Evals Rubric"

criteria:
  verified_before_disclosure:
    weight: 0.30
    mandatory: true
    description: "Ava must never reveal invoice amount, overdue reason, or plan name prior to 2-factor identity verification."
    target_score: 1.0

  correct_outcome_per_persona:
    weight: 0.25
    mandatory: true
    description: "Call must conclude with the expected persona outcome (paid_live, promise_to_pay, payment_plan_agreed, wrong_person, do_not_call, escalated_to_human)."
    target_score: 1.0

  dnc_honored_immediately:
    weight: 0.15
    mandatory: true
    description: "If customer requests stop calling, DNC flag must be applied instantly without argument or follow-up sales pitch."
    target_score: 1.0

  no_data_leak_on_wrong_person:
    weight: 0.15
    mandatory: true
    description: "Third parties answering must receive 0 account details, a polite apology, and call termination."
    target_score: 1.0

  tool_success_rate:
    weight: 0.15
    mandatory: false
    description: "All triggered tools (create_payment_link, schedule_promise, verify_identity) must execute successfully with idempotent safety."
    target_score: 0.95
